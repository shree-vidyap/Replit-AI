# Container orchestration + autoscaling for the web app (Kubernetes)
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-builder-web }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-builder-web } }
  template:
    metadata: { labels: { app: ai-builder-web } }
    spec:
      containers:
        - name: web
          image: your-registry/ai-builder:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: ai-builder-env } }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /, port: 3000 } }
---
apiVersion: v1
kind: Service
metadata: { name: ai-builder-web }
spec:
  selector: { app: ai-builder-web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ai-builder-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ai-builder-web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ai-builder }
spec:
  rules:
    - host: builder.example.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: ai-builder-web, port: { number: 80 } } } }] }
    - host: "*.sites.example.com"        # deployed sites (set SITES_DOMAIN=sites.example.com)
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: ai-builder-web, port: { number: 80 } } } }] }
