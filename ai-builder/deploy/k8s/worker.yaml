# Worker pool: scales with queue load. It starts sandbox containers through a Docker daemon.
# NOTE: mounting the host Docker socket is for trusted single-tenant clusters. For multi-tenant production,
# run builds/sandboxes as Kubernetes Jobs with gVisor/Kata instead.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-builder-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-builder-worker } }
  template:
    metadata: { labels: { app: ai-builder-worker } }
    spec:
      containers:
        - name: worker
          image: your-registry/ai-builder-worker:latest
          envFrom: [{ secretRef: { name: ai-builder-env } }]
          volumeMounts: [{ name: docker-sock, mountPath: /var/run/docker.sock }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ai-builder-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ai-builder-worker }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
