services:
  postgres:
    image: postgres:16
    container_name: ai-builder-pg
    environment:
      POSTGRES_PASSWORD: pass
    ports: ["15432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    container_name: ai-builder-redis
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus
    container_name: ai-builder-prometheus
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  pgdata:
